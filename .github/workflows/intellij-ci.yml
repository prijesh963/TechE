name: IntelliJ plugin CI

# Separate from the npm-based CI workflow on purpose: this package is
# Kotlin/Gradle, not TypeScript, and lives on its own integration branch
# (intellij-main) rather than main. Path-filtered so a change elsewhere in
# the monorepo doesn't spend minutes resolving an IDE SDK for nothing.

on:
  pull_request:
    paths:
      - "packages/intellij-plugin/**"
      - ".github/workflows/intellij-ci.yml"
  push:
    branches:
      - intellij-main
    paths:
      - "packages/intellij-plugin/**"
      - ".github/workflows/intellij-ci.yml"
  # Lets anyone with write access trigger a build on demand from the Actions
  # tab (Run workflow button) to get a fresh installable .zip, without
  # needing a qualifying code change to push first — the practical escape
  # hatch for a network that can reach JetBrains' web servers but not their
  # dependency-resolution hosts (see docs/KNOWN_LIMITATIONS.md 4.19/4.17).
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/intellij-plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # IntelliJ Platform 2024.2 (see build.gradle.kts) runs on JBR 21;
          # 17 here made compileKotlin's toolchain resolution fail once the
          # Gradle config itself was fixed to target 21.
          java-version: "21"
      - name: Build
        run: ./gradlew build --no-daemon
      - name: Verify plugin
        run: ./gradlew verifyPlugin --no-daemon
      # Only uploaded once the two steps above already succeeded (a step
      # that fails stops the job by default), so a broken build never
      # produces a downloadable .zip that looks like a good one. This is
      # the one place to grab an installable plugin without local Gradle
      # access to JetBrains' distribution hosts — see the README's
      # "Building" section for why that's sometimes not possible at all.
      - name: Upload built plugin
        uses: actions/upload-artifact@v4
        with:
          name: copilot-architect-intellij-plugin
          path: packages/intellij-plugin/build/distributions/*.zip
          if-no-files-found: error
